<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b8a3a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&family=Mukta+Malar:wght@400;600;700&display=swap">
<title>FOODBRIDGE</title>
<style>

:root{
  --disp:"Baloo Thambi 2","Noto Sans Tamil","Nirmala UI",system-ui,sans-serif;
  --body:"Mukta Malar","Noto Sans Tamil","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F2F8EF;--card:#fff;--tx:#1B1A2E;--mut:#58566B;--bd:#DCE6D6;
  --btn:#0B6E4F;--btn-tx:#fff;--link:#0B6E4F;
  --claim:#FFB000;--claim-tx:#1B1A2E;--claim-sh:#C98600;
  --ok:#0B6E4F;--amb:#8A5300;--red:#B3162B;
  --ok-bg:#DDF3E6;--amb-bg:#FFF0CC;--red-bg:#FFE0E3;
  --ring:#2B2D7E;--h1:#0B6E4F;--h2:#1B5A6E;--h3:#2B2D7E;
  --cat:#6B6A85;--cat-tx:#4F4E68;--cat-bg:#E8E8F0;
}
.c-bakery{--cat:#F0A000;--cat-tx:#8A5300;--cat-bg:#FFF0CC}
.c-meal{--cat:#D7263D;--cat-tx:#B3162B;--cat-bg:#FFE3E6}
.c-produce{--cat:#2E9E44;--cat-tx:#1E7A34;--cat-bg:#DDF3E1}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
select,input,button{font:inherit}
[hidden]{display:none!important}
.chk{display:inline-flex;gap:6px;align-items:center;margin:6px 10px 0 0;font-weight:400}.chk input{width:auto}
.link{background:none;border:0;color:var(--link);text-decoration:underline;padding:10px 0;font-weight:600;cursor:pointer}
.warn{border-color:var(--amb);background:var(--amb-bg);color:var(--amb)}
textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;resize:vertical}
.flag{border-color:var(--amb)!important;box-shadow:0 0 0 2px var(--amb)}
.warnline{color:var(--amb)}
.qr{width:190px;height:190px;margin:10px auto;background:#fff;padding:6px;border-radius:10px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:18px;text-align:center;letter-spacing:1px;font-weight:700}
.center{text-align:center}
.v-new,.v-pickup,.v-route,.v-passport,.v-undefined{max-width:680px}
.v-proof{max-width:880px}

/* cards (the boxes) */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.card[class*=" c-"]{border-left:7px solid var(--cat)}
.card.dim{opacity:.74}
.card.warn{border-left-color:var(--amb)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead{display:flex;align-items:center;gap:12px}
.cat-art{flex:none;width:54px;height:54px;border-radius:16px;background:var(--cat-bg);color:var(--cat);display:grid;place-items:center}
.cat-art svg{width:40px;height:40px}
.ctext{flex:1;min-width:0}
.ctitle{font:700 20px/1.15 var(--disp)}
.ctitle::first-letter{text-transform:uppercase}
html[lang=ta] .ctitle{font-size:17px;line-height:1.3}
html[lang=ta] .stg{font-size:10.5px}
.qty{flex:none;text-align:center;line-height:1}
.qty b{display:block;font:800 30px/1 var(--disp);color:var(--cat-tx)}
.qty span{font-size:12px;color:var(--mut)}
h2{font:700 20px/1.2 var(--disp);margin:14px 0 6px}
.mut{color:var(--mut);font-size:14.5px}
.badge{font-size:12.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card);white-space:nowrap}
.badge.ok{display:inline-block;margin-bottom:8px;background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.clock{display:inline-block;padding:0 12px;border-radius:99px;font:700 20px/1.5 var(--disp);font-variant-numeric:tabular-nums}
.clock.green{background:var(--ok-bg);color:var(--ok)}.clock.amber{background:var(--amb-bg);color:var(--amb)}.clock.red{background:var(--red-bg);color:var(--red)}
label{display:block;font-weight:700;margin-top:12px}
input,select.f{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}

/* buttons (the tappy things) */
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-tx);font-weight:700;font-size:17px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--link);border:1.5px solid var(--link)}
.btn.bad{background:var(--red);color:#fff}
.btn.claim{background:var(--claim);color:var(--claim-tx);font:800 20px/1.2 var(--disp);padding:13px 14px 12px;box-shadow:0 3px 0 var(--claim-sh)}
.btn.claim:active{transform:translateY(2px);box-shadow:0 1px 0 var(--claim-sh)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin-top:8px;font-size:15px}

/* proof tiles (the receipts) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--tc,var(--btn));border-radius:14px;padding:10px;text-align:center;font-size:14px}
.tile:nth-child(4n+2){--tc:#F0A000}.tile:nth-child(4n+3){--tc:#D7263D}.tile:nth-child(4n+4){--tc:#2B2D7E}
.tile b{display:block;font:800 30px/1.2 var(--disp);color:var(--tx)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--red);font-weight:700}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:560px;margin:0 auto;padding:12px 14px;border-radius:14px;background:#0B6E4F;color:#fff;z-index:9;display:none;font-weight:600}
.toast.bad{background:#B3162B}
ul{padding-left:18px;margin:6px 0}

/* stages, little pills, and the route */
.stages{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0}
.stg{flex:1 1 auto;text-align:center;white-space:nowrap;font-size:11.5px;padding:6px 5px;border-radius:9px;border:1px solid var(--bd);color:var(--mut)}
.stg.done{background:var(--btn);border-color:var(--btn);color:var(--btn-tx)}
.stg.current{border-color:var(--cat-tx,var(--link));color:var(--tx);font-weight:800;box-shadow:0 0 0 2px var(--cat,var(--link)) inset}
.stg.failed{background:var(--red);border-color:var(--red);color:#fff}
.stg.skipped{opacity:.45;border-style:dashed}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--amb);background:var(--amb-bg);color:var(--amb);margin:2px 4px 0 0}
.pill.red{border-color:var(--red);background:var(--red-bg);color:var(--red)}.pill.green{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.stop{display:flex;gap:10px}.stop .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ring);color:var(--card);font:800 17px var(--disp);display:flex;align-items:center;justify-content:center}
.net{background:#8A5300;color:#fff;font-size:13px;padding:7px 12px;text-align:center}
.hist{font-size:13px;border-left:3px solid var(--bd);padding-left:10px;margin:8px 0}
.hist div{margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}

/* big screens: the card lists turn into a grid */
@media (min-width:760px){
  .v-feed,.v-mine,.v-claims,.v-live,.v-approve,.v-incidents,.v-fairness{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
  :is(.v-feed,.v-mine,.v-claims,.v-live,.v-approve,.v-incidents,.v-fairness)>.card{margin:0}
  :is(.v-feed,.v-mine,.v-claims,.v-live,.v-approve,.v-incidents,.v-fairness)>:not(.card),:is(.v-feed,.v-mine,.v-claims,.v-live,.v-approve,.v-incidents,.v-fairness)>.card.warn{grid-column:1/-1}
}

/* big-button mode (easier to tap) */
body.big{font-size:20px}body.big .btn{padding:18px;font-size:20px}body.big nav button{padding:14px 18px;font-size:18px}
body.big input,body.big select.f,body.big textarea{padding:15px;font-size:20px}body.big .clock{font-size:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.note,.toast,.noprint{display:none!important}.card{break-inside:avoid}}
/* ===== the look, borrowed from foodbridge-1.py ===== */
:root{--g1:#1b8a3a;--g2:#0e6b5c;--or:#ff8a1f;--pk:#ff4f8b;--bl:#2b7de9;--yl:#ffc933;--pu:#7c4dff;--ink:#1f2a1f;--card:#fff}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;color:var(--ink);
background:linear-gradient(160deg,#fff7e6 0%,#e8fff0 45%,#e6f3ff 100%);background-attachment:fixed;min-height:100vh}
a{color:var(--bl)}
.blobs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;animation:drift 18s ease-in-out infinite}
.blobs i:nth-child(1){width:320px;height:320px;background:#ffc933;left:-80px;top:10%}
.blobs i:nth-child(2){width:380px;height:380px;background:#4ccf75;right:-120px;top:35%;animation-delay:-6s}
.blobs i:nth-child(3){width:300px;height:300px;background:#ff8fb5;left:30%;bottom:-120px;animation-delay:-11s}
@keyframes drift{50%{transform:translate(40px,-50px) scale(1.15)}}
header.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
padding:10px 16px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;box-shadow:0 3px 14px #0003}
.brand{font-weight:900;font-size:1.3rem;color:#fff;text-decoration:none;letter-spacing:.5px;display:flex;gap:8px;align-items:center}
.brand span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-8deg)}}
nav.links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav.links a{color:#fff;text-decoration:none;font-weight:700;padding:7px 12px;border-radius:999px;font-size:.92rem}
nav.links a:hover{background:#ffffff30}nav.links a.on{background:#fff;color:var(--g1)}
nav.links a.cta{background:var(--or);color:#fff}
.note{font-size:.8rem;color:#5a665a;padding:10px 16px;text-align:center}
main{max-width:1020px;margin:0 auto;padding:6px 14px 50px}
main.wide{max-width:none;padding:0}
.card{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #0f3d1a1c;border:1px solid #eef3ee}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.15}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:2px solid #dfe8df;border-radius:12px;font:inherit;background:#fbfffb}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 4px #1b8a3a22}
input[type=checkbox],input[type=radio]{width:auto}
.btn{display:inline-block;border:0;cursor:pointer;padding:12px 20px;border-radius:14px;font:inherit;font-weight:800;color:#fff;text-decoration:none;
background:linear-gradient(135deg,var(--g1),#27b24f);box-shadow:0 4px 12px #1b8a3a55;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 18px #1b8a3a55}
.btn.full{width:100%;margin-top:16px;text-align:center}
.btn.or{background:linear-gradient(135deg,var(--or),#ffb23f);box-shadow:0 4px 12px #ff8a1f55}
.btn.pk{background:linear-gradient(135deg,var(--pk),#ff7ab0);box-shadow:0 4px 12px #ff4f8b55}
.btn.bl{background:linear-gradient(135deg,var(--bl),#58a2ff);box-shadow:0 4px 12px #2b7de955}
.btn.pu{background:linear-gradient(135deg,var(--pu),#a584ff);box-shadow:0 4px 12px #7c4dff55}
.btn.ghost{background:#fff;color:var(--g1);border:2px solid var(--g1);box-shadow:none}
.btn.big{padding:16px 30px;font-size:1.15rem}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff8a1faa}70%{box-shadow:0 0 0 18px #ff8a1f00}100%{box-shadow:0 0 0 0 #ff8a1f00}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid.sm{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border-radius:20px;padding:20px 10px;text-align:center;color:#fff;box-shadow:0 8px 20px #0002}
.stat b{display:block;font-size:2.3rem}.stat span{font-weight:700;font-size:.95rem}
.s1{background:linear-gradient(135deg,#ff8a1f,#ffb23f)}.s2{background:linear-gradient(135deg,#1b8a3a,#4ccf75)}
.s3{background:linear-gradient(135deg,#2b7de9,#6bb0ff)}.s4{background:linear-gradient(135deg,#ff4f8b,#ff8fb5)}
.s5{background:linear-gradient(135deg,#7c4dff,#a584ff)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:800;background:#e3f6e8;color:#12692c;white-space:nowrap}
.badge.reserved,.badge.pending,.badge.open{background:#fff1d6;color:#a35b00}
.badge.collected,.badge.completed,.badge.accepted{background:#dff0ff;color:#0f4fa0}
.badge.expired,.badge.rejected{background:#ffe1e8;color:#a3123c}
.badge.resolved{background:#e6e6f5;color:#44447a}
.badge.incident{background:#ffe1e8;color:#a3123c}.badge.complaint{background:#fff1d6;color:#a35b00}
.vb{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:999px}
.vb.y{background:#dff7e6;color:#0e5a26}.vb.n{background:#fff1d6;color:#a35b00}
.flash{padding:12px 16px;border-radius:12px;margin:12px 0;font-weight:700;animation:pop .5s}
.flash.ok{background:#dff7e6;color:#0e5a26}.flash.err{background:#ffe3e3;color:#9b1c1c}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:16px;border:3px solid #fff;box-shadow:0 3px 10px #0003;background:#eef}
.ph{width:84px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:linear-gradient(135deg,#ffe3b0,#ffd0e0)}
.item{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.item .body{flex:1 1 220px}
.time{font-size:1.4rem;font-weight:900;color:var(--g2);font-variant-numeric:tabular-nums}
.time.urgent{color:#d6194a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.muted{color:#5a665a}.small{font-size:.85rem}
.msg{white-space:pre-wrap;background:#f3fbf5;border-left:5px solid var(--g1);padding:12px;border-radius:10px;font-size:.92rem;word-break:break-word}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg label{flex:1 1 170px;margin:0;border:2px solid #dfe8df;border-radius:14px;padding:12px;font-weight:700;cursor:pointer;transition:.2s}
.seg label:hover{border-color:var(--g1);transform:translateY(-2px)}
.seg input{margin-right:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips label{margin:0;font-weight:600;border:2px solid #dfe8df;border-radius:999px;padding:6px 12px}
.page-title{text-align:center;padding:22px 8px 6px}
.page-title .big{font-size:2.6rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eef3ee;vertical-align:top;font-size:.92rem}
.scroll-x{overflow-x:auto}
/* stuff fades in as you scroll */
.js .rv{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s}
.js .rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}
.tilt{transition:transform .2s;will-change:transform}
.ico{width:28px;height:28px;display:inline-block;vertical-align:middle;flex:none}
.ico.s{width:20px;height:20px;margin:-3px 6px 0 0}
.bgfood{position:fixed;bottom:-90px;width:46px;height:46px;opacity:.3;z-index:-1;pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(360deg)}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}}
@keyframes inR{from{opacity:0;transform:translateX(40px)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.7)}}
.brand .ico{width:36px;height:36px;filter:drop-shadow(0 2px 3px #0004)}
.ribbon{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#fff3d6,#ffe1ec,#e0f7e8,#e1efff,#fff3d6);border-bottom:3px solid #ffd27a;padding:6px 0}
.ribbon div{display:inline-flex;gap:26px;padding-right:26px;animation:marq 60s linear infinite}
.ribbon .ico{width:34px;height:34px;filter:drop-shadow(0 2px 2px #0002)}
.ribbon:hover div{animation-play-state:paused}
.strip{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:16px 0 0}
.strip .ico{width:46px;height:46px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px #0002)}
.strip .ico:nth-child(2){animation-delay:-.4s}.strip .ico:nth-child(3){animation-delay:-.8s}
.strip .ico:nth-child(4){animation-delay:-1.2s}.strip .ico:nth-child(5){animation-delay:-1.6s}.strip .ico:nth-child(6){animation-delay:-2s}
.page-title .big{display:inline-block;animation:bob 2.6s ease-in-out infinite}
.burger{display:none;flex-direction:column;gap:5px;background:#ffffff26;border:0;border-radius:12px;padding:10px;cursor:pointer}
.burger i{display:block;width:22px;height:3px;background:#fff;border-radius:3px;transition:.25s}
.burger.x i:nth-child(1){transform:translateY(8px) rotate(45deg)}.burger.x i:nth-child(2){opacity:0}.burger.x i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.js .rv.fl{transform:translateX(-60px)}.js .rv.fr{transform:translateX(60px)}.js .rv.zm{transform:scale(.8)}.js .rv.rt{transform:rotate(-5deg) translateY(30px)}
.js .rv.fl.in,.js .rv.fr.in,.js .rv.zm.in,.js .rv.rt.in{opacity:1;transform:none}
.grid>.rv:nth-child(2){transition-delay:.1s}.grid>.rv:nth-child(3){transition-delay:.2s}.grid>.rv:nth-child(4){transition-delay:.3s}
.grid>.rv:nth-child(5){transition-delay:.4s}.grid>.rv:nth-child(6){transition-delay:.5s}
.stat{transition:transform .25s}.stat:hover{transform:translateY(-4px) rotate(-1deg)}
footer a{color:#5a665a}
.confetti{position:fixed;top:-30px;z-index:99;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
footer{text-align:center;padding:24px 14px;color:#5a665a;font-size:.85rem}
@media(max-width:620px){main{padding:4px 10px 40px}.stat b{font-size:1.9rem}.thumb,.ph{width:68px;height:68px}
 nav.links a{padding:6px 9px;font-size:.85rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
@media(max-width:760px){
 header.top{padding:8px 12px}.burger{display:flex}
 nav.links{display:none;width:100%;flex-direction:column;align-items:stretch;padding:6px 0;animation:inL .3s}
 nav.links.open{display:flex}nav.links a{padding:11px 14px;font-size:1rem;border-radius:12px}
 .note{font-size:.72rem;padding:8px 12px}.page-title .big{font-size:2rem}h1{font-size:1.6rem}
 .strip .ico{width:36px;height:36px}.hero .fl.x{display:none}}
@media(max-width:480px){.card{padding:14px;border-radius:16px}.btn.big{padding:13px 18px;font-size:1rem}.btn{padding:11px 16px}
 .code{font-size:1.8rem}.ribbon .ico{width:28px;height:28px}input,select,textarea{font-size:16px}}
@media(min-width:1100px){main{max-width:1180px}.grid{gap:18px}}
@media(hover:none){.btn:hover,.stat:hover{transform:none}}
@media (prefers-reduced-motion:reduce){.bgfood{display:none}.js .rv.fl,.js .rv.fr,.js .rv.zm,.js .rv.rt{opacity:1;transform:none}}

.hero{position:relative;text-align:center;padding:54px 16px 30px;color:#fff;overflow:hidden;
background:linear-gradient(135deg,#1b8a3a,#0e6b5c 55%,#2b7de9)}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin:.1em 0}

function trErr(m) {      // server errors come in English, so we swap them to Tamil when the app is in Tamil

  if (/^Category\/storage .* is not accepted/.test(m)) return 'இந்த உணவு வகை/சேமிப்பு முறை இன்னும் ஏற்கப்படவில்லை';

const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

async function api(path, o = {}) {
  const headers = {'Content-Type': 'application/json'};
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  let r;
  try { r = await fetch('/api' + path, {method: o.method || 'GET', headers, body: o.body ? JSON.stringify(o.body) : undefined}); }
  catch (e) { S.lastFail = Date.now(); const err = new Error(t('offlineNote')); err.offline = true; throw err; }
  S.lastOk = Date.now();
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && S.token && path !== '/auth/login') { logout(); throw new Error(t('sessionExpired')); }
  if (!r.ok) { const d = j && j.detail, raw = Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || r.statusText); const err = new Error(trErr(raw)); err.raw = raw; throw err; }
  return j;
}
let toastT;
function toast(msg, bad) { if (!bad && [t('claimedOk'), t('handedOk'), t('registeredOk')].includes(msg)) confetti(); if (bad && /offline|connection/i.test(msg)) S.lastFail = Date.now(); const el = $('#toast'); el.textContent = msg; el.className = 'toast' + (bad ? ' bad' : ''); el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 4000); }
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const sync = d => { if (d && d.server_now) S.offset = new Date(d.server_now).getTime() - Date.now(); };

function tick() {
  const now = Date.now() + S.offset;
  document.querySelectorAll('[data-dl]').forEach(el => {
    const ms = new Date(el.dataset.dl).getTime() - now;
    if (ms <= 0) { el.textContent = t('closed'); el.className = 'clock red'; return; }
    const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000);
    el.textContent = m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ':' + String(s).padStart(2, '0');
    el.className = 'clock ' + (m >= 30 ? 'green' : m >= 10 ? 'amber' : 'red');
  });
}

// ---------- v0.7 stuff: stages, speech, offline mode ----------
const stagesBar = st => `<div class="stages">${st.map(x => `<div class="stg ${esc(x.state)}">${x.state === 'done' ? '✓ ' : x.state === 'failed' ? '✕ ' : ''}${esc(t('stg_' + x.key))}</div>`).join('')}</div>`;
const riskPills = rs => (rs || []).map(r => `<span class="pill red">⚠ ${esc(t('risk_' + r))}</span>`).join('');
function claimStages(x) {   // simple progress bar for the recipient's own claim
  const done = x.status === 'completed';
  return [{key: 'listed', state: 'done'}, {key: 'offered', state: 'skipped'}, {key: 'claimed', state: 'done'},
    {key: 'pickup', state: x.picked_up || done ? 'done' : (x.status === 'reserved' ? 'current' : 'pending')},
    {key: 'handover', state: done ? 'done' : (x.status === 'rejected' ? 'failed' : 'pending')}];
}
function speak(text) {
  if (!('speechSynthesis' in window)) return toast(t('noVoice'), true);
  const lang = S.lang === 'ta' ? 'ta-IN' : 'en-IN', u = new SpeechSynthesisUtterance(text);
  u.lang = lang; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2)));
  if (v) u.voice = v; else if (speechSynthesis.getVoices().length) return toast(t('noVoice'), true);
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const expl = (reasons, en) => S.lang === 'ta' && reasons && reasons.length ? t('explainLead') + ' ' + reasons.map(c => t('rs_' + c)).join(', ') + '. ' + t('explainNote') : en;

window.readAloud = (qty, cat, donor, eta, mins) => speak(S.lang === 'ta'

async function sendPending(quiet) {   // the server checks the safe window again, so offline data can never bring an expired listing back to life
  const p = pendingGet(); if (!p || !S.me || S.me.role !== 'donor') return;
  try { await api('/donations', {method: 'POST', body: p}); pendingSet(null); store('fb_draft', null); toast(t('sentOk')); if (S.tab === 'new' || S.tab === 'mine') { S.tab = 'mine'; show(); } }
  catch (e) { if (e.offline) { S.lastFail = Date.now(); if (!quiet) toast(e.message, true); return; } pendingSet(null); toast(/closed|window/i.test(e.raw || e.message) ? t('droppedStale') : e.message, true); }
}

unt\" data-to=\"0\" data-live=\"recipients\">0</b><div class=\"muted\">recipients</div></div></div></div>\n</section>\n\n<section class=\"sec\">\n <h2 class=\"rv\">Join as\u2026</h2>\n <div class=\"grid\">\n  <div class=\"card role rv tilt\"><div class=\"big\">\ud83c\udfea</div><h3>Donor</h3><p class=\"muted\">Bakeries, hotels, shops and homes with extra food.</p></div>\n  <div class=\"card role rv d1 tilt\"><div class=\"big\">\ud83c\udfe0</div><h3>Recipient</h3><p class=\"muted\">Orphanages, foundations and shelters that serve meals.</p></div>\n </div>\n <div class=\"cta-band rv\"><h2 style=\"margin-top:0\">Ready to rescue food today?</h2>\n  <a class=\"btn big\" style=\"background:#fff;color:#e0560a\" href=\"#\" data-go=\"register\">\ud83c\udf08 Get started</a></div>\n</section>";
window.initStory=function(){
 var story=document.getElementById('story');if(!story)return;
 var stage=document.getElementById('stage'),items=[].slice.call(stage.querySelectorAll('.fd')),bowls=[].slice.call(stage.querySelectorAll('.bowl')),
     cnt=document.getElementById('bcount'),cap=document.getElementById('bcap');
 var N=items.length,W,H,bw,bh,bl,bt,slots=[],starts=[],last=-1;
 var CAPS=["Surplus food is waiting…","First loaf rescued 🍞","Fresh carrots on the way","Apples saved from the bin","Rice for a full plate","Milk saved from the bin","Bananas, still perfect","A cupcake joins in","Almost full…","A full bowl. A fed family. 💚"];
 function measure(){W=stage.clientWidth;H=stage.clientHeight;bw=W*.86;bh=bw*.655;bl=(W-bw)/2;bt=H-bh;
  for(var i=0;i<N;i++){var col=i%4,row=Math.floor(i/4);
   slots[i]={x:bl+bw*(.2+col*.2+(row%2?.07:0)),y:bt+bh*(.45-row*.09)};
   starts[i]={x:i%2?W+30:-70,y:H*(.04+((i*37)%30)/100)};}}
 function place(p){var landed=0;
  for(var i=0;i<N;i++){var a=i/N*.86,t=Math.min(1,Math.max(0,(p-a)/.14)),it=items[i],S=starts[i],E=slots[i];
   if(t<=0){it.style.opacity=0;continue}
   var cx=(S.x+E.x)/2,cy=Math.min(S.y,E.y)-H*.28,u=1-t;
   var x=u*u*S.x+2*u*t*cx+t*t*E.x,y=u*u*S.y+2*u*t*cy+t*t*E.y;
   it.style.opacity=1;it.style.transform='translate('+(x-24)+'px,'+(y-24)+'px) rotate('+(t*540)+'deg) scale('+(.7+.3*t)+')';
   if(t>=1)landed++;}
  if(landed!==last){last=landed;cnt.textContent=landed;cap.textContent=CAPS[Math.min(landed,CAPS.length-1)];
   bowls.forEach(function(b){b.classList.remove('wob');void b.getBoundingClientRect();b.classList.add('wob')});}}
 function onScroll(){if(!story.isConnected){removeEventListener("scroll",onScroll);return}var r=story.getBoundingClientRect(),total=story.offsetHeight-innerHeight+60;place(Math.min(1,Math.max(0,-r.top/total)));}
 measure();onScroll();
 addEventListener('scroll',onScroll,{passive:true});
 addEventListener('resize',function(){measure();onScroll()});
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){place(1);}
};
function authHead() { return S.mode === 'login' ? `<div class="page-title"><div class="big">🍞🥗🍛</div><h1>${esc(t('login'))}</h1></div>` : `<div class="page-title"><div class="big">🌈🍎🥖</div><h1>${esc(t('register'))}</h1></div>`; }
function pageTitle() {
  const r = S.me.role, vb = r === 'admin' ? '' : S.me.verified ? `<span class="vb y">✔ ${esc(t('verifiedB'))}</span>` : `<span class="vb n">⏳ ${esc(t('pendingB'))}</span>`;
  return `<div class="page-title"><div class="big">${{donor: '🏪', recipient: '🏠', admin: '🛡️'}[r]}</div><h1>${esc(S.me.name)}</h1><div>${vb}</div></div><div class="strip" aria-hidden="true">${['bread', 'apple', 'carrot', 'rice', 'milk', 'banana'].map(n => `<svg class="ico"><use href="#i-${n}"/></svg>`).join('')}</div>`;
}
async function dashTiles(v, tab) {
  if (tab !== 'mine' && tab !== 'feed') return;
  const put = i => { if (S.tab !== tab || !v.isConnected || v.querySelector('.tiles')) return; const tl = (n, k) => `<div class="tile"><b>${+n}</b>${esc(t(k))}</div>`;
    const s = v.querySelector('.strip'); if (s) s.insertAdjacentHTML('afterend', `<div class="tiles">${tl(i.listed_units, 'listed')}${tl(i.collected_units, 'collected')}${tl(i.handovers_completed, 'done')}${tl(i.handovers_refused, 'refused')}</div>`); };
  if (S.tiles) put(S.tiles);

}
function viewHome() {
  const v = $('#view'); v.innerHTML = HOME_HTML;

  api('/public/stats').then(d => v.querySelectorAll('[data-live]').forEach(e => { const n = +d[{collected: 'collected_units', completed: 'handovers_completed'}[e.dataset.live] || e.dataset.live] || 0; e.dataset.to = n; if (e.dataset.done) e.textContent = n; })).catch(() => {});
  window.initStory();
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return; x.target.classList.add('in'); x.target.querySelectorAll('.count').forEach(count); if (x.target.classList.contains('count')) count(x.target); io.unobserve(x.target); }), {threshold: .15}) : null;
function count(e) { if (e.dataset.done) return; e.dataset.done = 1; const to = parseFloat(e.dataset.to), dec = +(e.dataset.dec || 0); let t0 = null;
  const step = ts => { if (!t0) t0 = ts; const k = Math.min(1, (ts - t0) / 1600); e.textContent = (parseFloat(e.dataset.to) * (1 - Math.pow(1 - k, 3))).toFixed(dec); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function fxInit(root) {
  root.querySelectorAll('.rv').forEach(e => io ? io.observe(e) : e.classList.add('in'));
  root.querySelectorAll('.tilt').forEach(c => { c.onmousemove = e => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `perspective(700px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg) translateY(-3px)`; }; c.onmouseleave = () => c.style.transform = ''; });
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const em = ['🍞', '🥕', '🍎', '🍚', '🥛', '🍌', '🎉', '💚'];
  for (let i = 0; i < 26; i++) { const c = document.createElement('div'); c.className = 'confetti'; c.textContent = em[i % em.length]; c.style.left = Math.random() * 100 + 'vw'; c.style.animationDuration = (2 + Math.random() * 2.2) + 's'; c.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 5000); }
}
async function boot() {
  document.documentElement.lang = S.lang;
  try { S.rules = await api('/rules'); } catch (e) { toast(e.message, true); }
  if (S.token) { try { S.me = await api('/me'); S.tab = TABS[S.me.role][0][0]; } catch (e) { S.token = null; store('fb_token', null); } }
  $('#lang').onclick = () => { S.lang = S.lang === 'en' ? 'ta' : 'en'; store('fb_lang', S.lang); document.documentElement.lang = S.lang; show(); };
  setInterval(() => { if (S.tab === 'feed' && S.me && !document.hidden) show(); }, 15000);
  setInterval(() => { if (S.tab === 'live' && S.me && !document.hidden) show(); }, 5000);
  try { document.body.classList.toggle('big', localStorage.getItem('fb_big') === '1'); } catch (e) {}
  $('#big').onclick = () => { const on = !document.body.classList.contains('big'); document.body.classList.toggle('big', on); store('fb_big', on ? '1' : null); };
  const m = /^#passport\/(\d+)$/.exec(location.hash);
  if (S.me && m) { S.pid = +m[1]; S.prevTab = S.tab; S.tab = 'passport'; }
  if (S.me) sendPending(true);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  $('#burger').onclick = () => { const o = $('#nav').classList.toggle('open'); $('#burger').classList.toggle('x', o); $('#burger').setAttribute('aria-expanded', o); };
  $('#brand').onclick = e => { e.preventDefault(); if (S.me) S.tab = TABS[S.me.role][0][0]; else S.mode = 'home'; closeMenu(); scrollTo(0, 0); show(); };
  show();
}
