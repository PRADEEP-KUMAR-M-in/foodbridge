services:
  - type: web
    name: foodbridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FOODBRIDGE_SECRET
        generateValue: true
      - key: FOODBRIDGE_AUTOSEED
        value: "1"
      - key: FOODBRIDGE_OFFER_WINDOW_MIN
        value: "2"
      - key: FOODBRIDGE_ADMIN_PASSWORD
        sync: false
